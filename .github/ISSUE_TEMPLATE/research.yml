name: Research question
description: A time-boxed question that ends with a research note (and maybe an ADR)
title: "[Research] "
labels: ["research"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: >-
        One focused main question, with numbered supporting questions in
        learning order if needed. State scope and exclusions; keep the work to
        roughly one or two days.
    validations:
      required: true
  - type: input
    id: timebox
    attributes:
      label: Time box
      description: >-
        Time before recording findings and reassessing unfinished work.
        Expiration does not complete unanswered questions; revise the time box
        or split the scope explicitly.
      placeholder: "for example: 4 hours"
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Planned public sources
      description: Papers, textbooks, documentation of open-source tools. Public sources only.
    validations:
      required: false
  - type: textarea
    id: output
    attributes:
      label: Expected output
      description: >-
        Follow docs/process/research.md. Keep applicable outputs and specify
        evidence; conceptual research does not require scripts.
      value: |
        - [ ] Primary note answers every agreed question with public sources
        - [ ] Assumptions, limitations, and out-of-scope open questions recorded
        - [ ] Artifacts linked and experiments reproduced (if applicable)
        - [ ] ADR or requirement updated (if a decision follows)
    validations:
      required: true
